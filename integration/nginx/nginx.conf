# nginx with HTTP/3, for the live cases of moonfetch: the same routes the mooncat server serves,
# under the same certificate, so one test file runs against either.
events {}

http {
  server {
    listen 443 ssl;
    listen 443 quic reuseport;
    server_name localhost;

    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.3;

    absolute_redirect off;
    add_header Alt-Svc 'h3=":443"; ma=86400';

    location / { return 200 "hello over h3\n"; }
    location /echo {
      add_header content-type application/json;
      return 200 '{"method":"$request_method","path":"$uri"}';
    }
    location /away { return 302 /; }
    # 8 MiB, more than one stream's window and more than the connection's, so the client has to
    # open both again as it reads. The file is mounted by the workflow.
    location = /big {
      root /srv;
      default_type application/octet-stream;
    }
  }
}
